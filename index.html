<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Ngày 20/10 💖</title>
    <!-- Font Google cho xịn -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px;
            overflow-x: hidden;
            position: relative;
        }

        /* Hiệu ứng hoa rơi */
        .flower-fall {
            position: fixed;
            top: -20px;
            pointer-events: none;
            z-index: 1;
            animation: fall linear infinite;
        }
        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
            }
        }

        /* Header */
        header {
            text-align: center;
            color: #d63384;
            margin-bottom: 25px;
            z-index: 2;
        }

        header h1 {
            font-size: 2.2rem;
            text-shadow: 2px 2px 8px rgba(255,255,255,0.8);
            margin-bottom: 8px;
        }

        header p {
            color: #555;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.4);
            padding: 6px 16px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            display: inline-block;
        }

        /* Khung điều chỉnh Nhạc Youtube */
        .music-bar {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            padding: 10px 18px;
            border-radius: 30px;
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 30px;
            z-index: 5;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            max-width: 500px;
            width: 100%;
        }

        .music-bar input {
            flex: 1;
            border: none;
            outline: none;
            padding: 8px 14px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.9);
            font-size: 0.85rem;
        }

        .music-bar button {
            background: #ff4757;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .music-bar button:hover {
            background: #ff6b81;
            transform: scale(1.03);
        }

        /* Lưới 20 Hộp quà */
        .gifts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 15px;
            max-width: 750px;
            width: 100%;
            z-index: 2;
            margin-bottom: 40px;
        }

        .gift-card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 18px;
            padding: 20px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            position: relative;
        }

        .gift-card:hover {
            transform: translateY(-8px) scale(1.05);
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 15px 25px rgba(255, 71, 87, 0.2);
        }

        .gift-card.opened {
            background: rgba(230, 230, 230, 0.5);
            border-color: #ccc;
            cursor: default;
            transform: none !important;
            opacity: 0.7;
        }

        .gift-icon {
            font-size: 2.2rem;
            display: block;
            margin-bottom: 8px;
        }

        .gift-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #d63384;
        }

        /* Popup hiển thị Lời chúc */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 24px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        @keyframes popUp {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
        }

        .modal-text {
            font-size: 1.05rem;
            color: #333;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .close-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
        }

        /* Khung Player YouTube ngầm */
        #yt-player-container {
            position: absolute;
            width: 1px; height: 1px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Khung phát Youtube ngầm -->
    <div id="yt-player-container"><div id="player"></div></div>

    <header>
        <h1>✨ Chúc Mừng Ngày 20/10 ✨</h1>
        <p>Mỗi món quà mang một lời chúc bí mật dành riêng cho bạn! 💖</p>
    </header>

    <!-- Nhập nhạc Youtube -->
    <div class="music-bar">
        <span>🎵</span>
        <input type="text" id="ytUrlInput" placeholder="Dán link YouTube tại đây...">
        <button onclick="changeMusic()">Đổi Nhạc</button>
    </div>

    <!-- Danh sách 20 hộp quà -->
    <div class="gifts-grid" id="giftsContainer"></div>

    <!-- Modal Lời Chúc -->
    <div class="modal" id="wishModal">
        <div class="modal-content">
            <div class="modal-icon" id="modalIcon">🎁</div>
            <div class="modal-text" id="modalText">Lời chúc...</div>
            <button class="close-btn" onclick="closeModal()">Nhận Lời Chúc 💖</button>
        </div>
    </div>

    <!-- Script YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // 20 Lời chúc & Phần quà KHÔNG TRÙNG LẶP
        const wishes = [
            { icon: "🌸", text: "Chúc bạn ngày 20/10 xinh đẹp rực rỡ như hoa xinh, luôn luôn tự tin và tỏa sáng!" },
            { icon: "🍫", text: "Tặng bạn sự ngọt ngào! Chúc cuộc sống của bạn luôn tràn ngập niềm vui và yêu thương." },
            { icon: "🧸", text: "Chúc bạn luôn có người che chở, chiều chuộng và giữ được sự đáng yêu vốn có nhé!" },
            { icon: "👑", text: "Hãy luôn nhớ rằng bạn là một nữ vương tuyệt vời trong chính cuộc đời của mình!" },
            { icon: "💄", text: "Chúc bạn ngày càng xinh xắn, lúc nào cũng tươi tắn và rạng ngời rực rỡ!" },
            { icon: "💌", text: "Gửi tới bạn triệu lời chúc tốt đẹp nhất, mong mọi ước mơ của bạn đều thành hiện thực!" },
            { icon: "🛍️", text: "Chúc bạn 20/10 mua sắm thả ga, săn deal rực rỡ, thích gì có đó!" },
            { icon: "🍰", text: "Chúc cuộc sống của bạn ngọt ngào hơn cả bánh ngọt và nhiều bất ngờ thú vị!" },
            { icon: "🌟", text: "Chúc bạn luôn giữ vững nụ cười tỏa nắng và may mắn trong mọi dự định sắp tới." },
            { icon: "💎", text: "Bạn là một viên ngọc quý giá. Chúc bạn luôn tỏa sáng theo cách riêng của mình!" },
            { icon: "🌷", text: "Chúc bạn nhẹ nhàng như nhành hoa tulip và luôn bình yên giữa cuộc sống!" },
            { icon: "🎀", text: "Chúc bạn luôn xinh đẹp, đáng yêu và nhận được vô vàn quà tặng ngọt ngào hôm nay!" },
            { icon: "🍀", text: "Tặng bạn lá xăm may mắn! Chúc bạn thi cử suôn sẻ, công việc mượt mà!" },
            { icon: "✈️", text: "Chúc bạn có thêm nhiều chuyến đi thú vị, khám phá những điều tuyệt vời mới!" },
            { icon: "📸", text: "Chúc bạn lúc nào lên hình cũng xinh đẹp lung linh, không góc chết!" },
            { icon: "🎧", text: "Chúc bạn luôn tận hưởng những giai điệu vui tươi nhất trong tâm hồn!" },
            { icon: "🧋", text: "Chúc bạn ăn hoài không béo, uống trà sữa luôn được free topping nha!" },
            { icon: "☀️", text: "Chúc bạn luôn là ánh nắng ấm áp mang niềm vui đến cho mọi người xung quanh." },
            { icon: "🎁", text: "Bất ngờ chưa! Chúc bạn nhận được món quà bạn mong ước nhất từ lâu!" },
            { icon: "❤️", text: "Cuối cùng, chúc bạn luôn được trân trọng, yêu thương và mãi mãi hạnh phúc!" }
        ];

        // Render 20 Hộp quà
        const container = document.getElementById('giftsContainer');
        wishes.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'gift-card';
            card.id = `gift-${index}`;
            card.innerHTML = `
                <span class="gift-icon">🎁</span>
                <span class="gift-title">Quà #${index + 1}</span>
            `;
            card.onclick = () => openGift(index);
            container.appendChild(card);
        });

        // Mở hộp quà
        function openGift(index) {
            const card = document.getElementById(`gift-${index}`);
            if (card.classList.contains('opened')) return;

            card.classList.add('opened');
            card.querySelector('.gift-icon').innerText = wishes[index].icon;

            document.getElementById('modalIcon').innerText = wishes[index].icon;
            document.getElementById('modalText').innerText = wishes[index].text;
            document.getElementById('wishModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('wishModal').style.display = 'none';
        }

        // Tự động tạo hoa rơi
        function createFlower() {
            const flower = document.createElement('div');
            flower.className = 'flower-fall';
            flower.innerText = ['🌸', '✨', '🌷', '💖', '🎀'][Math.floor(Math.random() * 5)];
            flower.style.left = Math.random() * 100 + 'vw';
            flower.style.animationDuration = Math.random() * 3 + 3 + 's';
            flower.style.fontSize = Math.random() * 12 + 12 + 'px';
            document.body.appendChild(flower);

            setTimeout(() => flower.remove(), 6000);
        }
        setInterval(createFlower, 300);

        // Xử lý nhạc Youtube
        let player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '0',
                width: '0',
                videoId: '2Vv-BfVoq4g', // Video nhạc nền mặc định (Perfect - Ed Sheeran)
                playerVars: { 'autoplay': 1, 'loop': 1, 'playlist': '2Vv-BfVoq4g' },
                events: {
                    'onReady': (e) => e.target.playVideo()
                }
            });
        }

        function changeMusic() {
            const url = document.getElementById('ytUrlInput').value.trim();
            if (!url) return alert("Vui lòng dán link YouTube!");

            let videoId = "";
            if (url.includes("v=")) {
                videoId = url.split("v=")[1].split("&")[0];
            } else if (url.includes("youtu.be/")) {
                videoId = url.split("youtu.be/")[1].split("?")[0];
            } else {
                videoId = url;
            }

            if (videoId && player && player.loadVideoById) {
                player.loadVideoById(videoId);
                alert("Đã đổi nhạc thành công! 🎉");
            } else {
                alert("Link YouTube không hợp lệ!");
            }
        }
    </script>
</body>
</html>
