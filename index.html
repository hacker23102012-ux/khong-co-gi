<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Ngày 20/10 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1b2e 0%, #2a1b3d 50%, #0f0c1b 100%);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px 15px;
            overflow-x: hidden;
            position: relative;
            color: #fff;
            transition: background 0.5s ease;
        }

        /* Hiệu ứng sao/hoa rơi nền tối */
        .star-fall {
            position: fixed;
            top: -20px;
            pointer-events: none;
            z-index: 1;
            animation: fall linear infinite;
        }
        @keyframes fall {
            to { transform: translateY(105vh) rotate(360deg); }
        }

        /* Nút mở Menu cài đặt nền/ảnh */
        .settings-toggle {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            z-index: 150;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .settings-toggle:hover { background: rgba(255, 255, 255, 0.3); }

        /* Bảng điều khiển chọn/tải ảnh */
        .settings-panel {
            position: fixed;
            top: 70px;
            left: 20px;
            background: rgba(30, 27, 46, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 158, 187, 0.3);
            padding: 15px;
            border-radius: 16px;
            z-index: 150;
            width: 260px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none;
            animation: popUp 0.2s ease;
        }
        .settings-panel h4 {
            font-size: 0.9rem;
            color: #ff9ebb;
            margin-bottom: 10px;
            text-align: center;
        }
        .settings-panel label {
            font-size: 0.75rem;
            color: #d1c4e9;
            display: block;
            margin-bottom: 5px;
        }
        .settings-panel select, .settings-panel input[type="file"] {
            width: 100%;
            padding: 6px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 0.8rem;
            margin-bottom: 12px;
            outline: none;
        }
        .settings-panel select option { background: #2a1b3d; color: #fff; }

        header {
            text-align: center;
            color: #ff9ebb;
            margin-bottom: 15px;
            z-index: 2;
        }
        header h1 {
            font-size: 2rem;
            text-shadow: 0 0 15px rgba(255, 158, 187, 0.5);
            margin-bottom: 5px;
        }
        header p {
            color: #d1c4e9;
            font-size: 0.95rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 5px 15px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            display: inline-block;
        }

        /* KHU VỰC ĐĨA NHẠC & LYRIC CHẠY */
        .music-visualizer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            width: 100%;
            max-width: 650px;
            margin-bottom: 20px;
            z-index: 5;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .vinyl-container {
            position: relative;
            width: 80px;
            height: 80px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .vinyl-disc {
            width: 100%;
            height: 100%;
            background: #111;
            border-radius: 50%;
            border: 4px solid #333;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: spin 4s linear infinite;
            animation-play-state: paused;
        }
        .vinyl-disc.playing { animation-play-state: running; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .vinyl-center { width: 26px; height: 26px; background: #ff9ebb; border-radius: 50%; border: 2px solid #fff; }

        .lyric-box {
            flex: 1;
            text-align: center;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #lyricText {
            font-size: 1.05rem;
            color: #ffccdf;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.6);
            letter-spacing: 0.5px;
        }

        /* Thanh đổi nhạc */
        .music-bar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 15px;
            border-radius: 30px;
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 25px;
            z-index: 5;
            max-width: 420px;
            width: 100%;
        }
        .music-bar input {
            flex: 1; border: none; outline: none; padding: 7px 12px;
            border-radius: 20px; background: rgba(255, 255, 255, 0.85); color: #333; font-size: 0.85rem;
        }
        .music-bar button {
            background: #ff6b81; color: white; border: none; padding: 7px 15px;
            border-radius: 20px; font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .music-bar button:hover { background: #ff4757; }

        /* Lưới 20 hộp quà */
        .gifts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 12px;
            max-width: 700px;
            width: 100%;
            z-index: 2;
            margin-bottom: 35px;
        }
        .gift-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 16px;
            padding: 15px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        .gift-card:hover {
            transform: translateY(-6px) scale(1.04);
            background: rgba(255, 255, 255, 0.25);
            border-color: #ff9ebb;
        }
        .gift-card.opened {
            background: rgba(100, 100, 100, 0.3);
            border-color: #444;
            cursor: default;
            transform: none !important;
            opacity: 0.6;
        }
        .gift-icon { font-size: 1.8rem; display: block; margin-bottom: 5px; }
        .gift-title { font-size: 0.78rem; font-weight: 700; color: #ff9ebb; }

        /* Nút Không Nhận Quà né chuột */
        .no-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: rgba(80, 80, 100, 0.8);
            color: #ddd;
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 9px 20px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 25px;
            cursor: pointer;
            z-index: 99;
            backdrop-filter: blur(5px);
            transition: top 0.15s ease, left 0.15s ease;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }
        .modal-content {
            background: #2a1b3d;
            border: 1px solid rgba(255, 158, 187, 0.4);
            color: #fff;
            padding: 25px;
            border-radius: 22px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popUp {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-icon { font-size: 3rem; margin-bottom: 12px; }
        .modal-text { font-size: 1rem; color: #f3e5f5; line-height: 1.6; margin-bottom: 20px; }
        .close-btn {
            background: #ff6b81; color: white; border: none; padding: 9px 22px;
            border-radius: 20px; font-weight: 600; cursor: pointer;
        }

        #yt-player-container { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    </style>
</head>
<body id="mainBody">

    <!-- Nút mở bảng cài đặt hình nền -->
    <button class="settings-toggle" onclick="toggleSettings()">🎨 Đổi Giao Diện</button>

    <!-- Bảng tuỳ chỉnh hình nền -->
    <div class="settings-panel" id="settingsPanel">
        <h4>Tùy Chỉnh Nền</h4>
        <label>Chọn nền có sẵn:</label>
        <select id="bgSelect" onchange="changePresetBg()">
            <option value="dark">Tối Lofi (Mặc định)</option>
            <option value="pink">Hồng Đào Dễ Thương</option>
            <option value="galaxy">Vũ Trụ Huyền Áo</option>
        </select>

        <label style="margin-top: 10px;">Hoặc tải ảnh nền của bạn:</label>
        <input type="file" id="customBgInput" accept="image/*" onchange="uploadBg(event)">
    </div>

    <div id="yt-player-container"><div id="player"></div></div>

    <header>
        <h1>✨ Chúc Mừng Ngày 20/10 ✨</h1>
        <p>Chọn hộp quà để nhận lời chúc và tận hưởng âm nhạc nhé! 💖</p>
    </header>

    <!-- KHU VỰC ĐĨA NHẠC XOAY & LYRIC CHẠY -->
    <div class="music-visualizer">
        <div class="vinyl-container" onclick="togglePlayPause()">
            <div class="vinyl-disc" id="vinylDisc">
                <div class="vinyl-center"></div>
            </div>
        </div>
        <div class="lyric-box">
            <div id="lyricText">🎵 Nhấn vào đĩa nhạc hoặc mở quà để phát nhạc...</div>
        </div>
    </div>

    <div class="music-bar">
        <span>🎧</span>
        <input type="text" id="ytUrlInput" placeholder="Dán ID YouTube bài hát khác...">
        <button onclick="changeMusic()">Đổi Nhạc</button>
    </div>

    <!-- 20 Hộp quà -->
    <div class="gifts-grid" id="giftsContainer"></div>

    <!-- Nút chạy trốn -->
    <button class="no-btn" id="noBtn" onmouseover="dodgeBtn()" ontouchstart="dodgeBtn()">Không nhận quà 😜</button>

    <!-- Modal Lời Chúc -->
    <div class="modal" id="wishModal">
        <div class="modal-content">
            <div class="modal-icon" id="modalIcon">🎁</div>
            <div class="modal-text" id="modalText">Lời chúc...</div>
            <button class="close-btn" onclick="closeModal()">Nhận Lời Chúc 💖</button>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const wishes = [
            { icon: "🌸", text: "Chúc bạn ngày 20/10 xinh đẹp rực rỡ như hoa xinh, luôn luôn tự tin và tỏa sáng!" },
            { icon: "🍫", text: "Tặng bạn sự ngọt ngào! Chúc cuộc sống của bạn luôn tràn ngập niềm vui và yêu thương." },
            { icon: "🧸", text: "Chúc bạn luôn có người che chở, chiều chuộng và giữ được sự đáng yêu vốn có nhé!" },
            { icon: "👑", text: "Hãy luôn nhớ rằng bạn là một nữ vương tuyệt vời trong chính cuộc đời của mình!" },
            { icon: "💄", text: "Chúc bạn ngày càng xinh xắn, lúc nào cũng tươi tắn và rạng ngời rực rỡ!" },
            { icon: "💌", text: "Gửi tới bạn triệu lời chúc tốt đẹp nhất, mong mọi ước mơ của bạn đều thành hiện thực!" },
            { icon: "🛍️", text: "Chúc bạn 20/10 mua sắm thả ga, săn deal rực rỡ, thích gì có đó!" },
            { icon: "🍰", text: "Chúc cuộc sống của bạn ngọt ngào hơn cả bánh ngọt và nhiều bất ngờ thú vị!" },
            { icon: "🌟", text: "Chúc bạn luôn giữ vững nụ cười tỏa nắng và may mắn trong mọi dự định sắp tới." },
            { icon: "💎", text: "Bạn là một viên ngọc quý giá. Chúc bạn luôn tỏa sáng theo cách riêng của mình!" },
            { icon: "🌷", text: "Chúc bạn nhẹ nhàng như nhành hoa tulip và luôn bình yên giữa cuộc sống!" },
            { icon: "🎀", text: "Chúc bạn luôn xinh đẹp, đáng yêu và nhận được vô vàn quà tặng ngọt ngào hôm nay!" },
            { icon: "🍀", text: "Tặng bạn lá xăm may mắn! Chúc bạn thi cử suôn sẻ, công việc mượt mà!" },
            { icon: "✈️", text: "Chúc bạn có thêm nhiều chuyến đi thú vị, khám phá những điều tuyệt vời mới!" },
            { icon: "📸", text: "Chúc bạn lúc nào lên hình cũng xinh đẹp lung linh, không góc chết!" },
            { icon: "🎧", text: "Chúc bạn luôn tận hưởng những giai điệu vui tươi nhất trong tâm hồn!" },
            { icon: "🧋", text: "Chúc bạn ăn hoài không béo, uống trà sữa luôn được free topping nha!" },
            { icon: "☀️", text: "Chúc bạn luôn là ánh nắng ấm áp mang niềm vui đến cho mọi người xung quanh." },
            { icon: "🎁", text: "Bất ngờ chưa! Chúc bạn nhận được món quà bạn mong ước nhất từ lâu!" },
            { icon: "❤️", text: "Cuối cùng, chúc bạn luôn được trân trọng, yêu thương và mãi mãi hạnh phúc!" }
        ];

        const playlist = [
            {
                id: "2Vv-BfVoq4g",
                name: "Perfect",
                lyrics: [
                    { time: 0, text: "💖 Chúc mừng ngày 20/10 tuyệt vời nhất..." },
                    { time: 10, text: "🎵 Baby, I'm dancing in the dark..." },
                    { time: 20, text: "🌸 With you between my arms..." },
                    { time: 35, text: "✨ Barefoot on the grass..." },
                    { time: 50, text: "🌷 Listening to our favorite song..." },
                    { time: 70, text: "💫 Mong mọi điều ngọt ngào nhất sẽ đến với bạn!" }
                ]
            },
            {
                id: "5qap5aO4i9A",
                name: "Lofi Chill",
                lyrics: [
                    { time: 0, text: "☕ Thư giãn cùng những giai điệu lofi..." },
                    { time: 15, text: "🌿 Chúc bạn một ngày ngập tràn năng lượng và nụ cười." },
                    { time: 35, text: "🎧 Cứ chill đi vì cuộc đời cho phép..." },
                    { time: 60, text: "💖 Mãi xinh đẹp và rạng rỡ thế này nhé!" }
                ]
            }
        ];
        let currentSongIndex = 0;

        // Render 20 Hộp quà
        const container = document.getElementById('giftsContainer');
        wishes.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'gift-card';
            card.id = `gift-${index}`;
            card.innerHTML = `<span class="gift-icon">🎁</span><span class="gift-title">Quà #${index + 1}</span>`;
            card.onclick = () => openGift(index);
            container.appendChild(card);
        });

        function openGift(index) {
            ensurePlayMusic();
            const card = document.getElementById(`gift-${index}`);
            if (card.classList.contains('opened')) return;

            card.classList.add('opened');
            card.querySelector('.gift-icon').innerText = wishes[index].icon;
            document.getElementById('modalIcon').innerText = wishes[index].icon;
            document.getElementById('modalText').innerText = wishes[index].text;
            document.getElementById('wishModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('wishModal').style.display = 'none'; }

        // Mở / Đóng bảng chỉnh giao diện
        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        // Đổi hình nền có sẵn
        function changePresetBg() {
            const val = document.getElementById('bgSelect').value;
            const body = document.getElementById('mainBody');
            if (val === 'dark') {
                body.style.background = 'linear-gradient(135deg, #1e1b2e 0%, #2a1b3d 50%, #0f0c1b 100%)';
            } else if (val === 'pink') {
                body.style.background = 'linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #ff6b81 100%)';
            } else if (val === 'galaxy') {
                body.style.background = 'linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%)';
            }
        }

        // Tải ảnh nền tùy chỉnh từ máy tính
        function uploadBg(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('mainBody').style.backgroundImage = `url('${e.target.result}')`;
                };
                reader.readAsDataURL(file);
            }
        }

        // Né nút không nhận
        function dodgeBtn() {
            const btn = document.getElementById('noBtn');
            const maxLeft = window.innerWidth - btn.offsetWidth - 20;
            const maxTop = window.innerHeight - btn.offsetHeight - 20;
            btn.style.left = Math.max(20, Math.floor(Math.random() * maxLeft)) + 'px';
            btn.style.top = Math.max(20, Math.floor(Math.random() * maxTop)) + 'px';
            btn.style.bottom = 'auto';
            btn.style.right = 'auto';
        }

        // Tạo hiệu ứng sao/hoa rơi
        function createStar() {
            const star = document.createElement('div');
            star.className = 'star-fall';
            star.innerText = ['✨', '🌸', '💖', '⭐', '🌷'][Math.floor(Math.random() * 5)];
            star.style.left = Math.random() * 100 + 'vw';
            star.style.animationDuration = Math.random() * 3 + 3 + 's';
            star.style.fontSize = Math.random() * 10 + 10 + 'px';
            document.body.appendChild(star);
            setTimeout(() => star.remove(), 6000);
        }
        setInterval(createStar, 350);

        // YouTube Player & Sync Lyric
        let player;
        let isPlaying = false;
        let lyricInterval;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '0', width: '0',
                videoId: playlist[0].id,
                playerVars: { 'autoplay': 1, 'controls': 0 },
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            const disc = document.getElementById('vinylDisc');
            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                disc.classList.add('playing');
                startLyricSync();
            } else {
                disc.classList.remove('playing');
                stopLyricSync();
            }
            if (event.data === YT.PlayerState.ENDED) {
                setTimeout(() => {
                    currentSongIndex = (currentSongIndex + 1) % playlist.length;
                    player.loadVideoById(playlist[currentSongIndex].id);
                }, 500);
            }
        }

        function togglePlayPause() {
            if (!player) return;
            if (isPlaying) { player.pauseVideo(); } else { player.playVideo(); }
        }

        function ensurePlayMusic() {
            if (player && player.playVideo && !isPlaying) { player.playVideo(); }
        }
        document.body.addEventListener('click', ensurePlayMusic, { once: true });

        function startLyricSync() {
            clearInterval(lyricInterval);
            lyricInterval = setInterval(() => {
                if (!player || !player.getCurrentTime) return;
                const currentTime = player.getCurrentTime();
                const currentSong = playlist[currentSongIndex];
                let activeLyric = currentSong.lyrics[0].text;
                for (let i = 0; i < currentSong.lyrics.length; i++) {
                    if (currentTime >= currentSong.lyrics[i].time) {
                        activeLyric = currentSong.lyrics[i].text;
                    }
                }
                document.getElementById('lyricText').innerText = activeLyric;
            }, 500);
        }

        function stopLyricSync() { clearInterval(lyricInterval); }

        function changeMusic() {
            const val = document.getElementById('ytUrlInput').value.trim();
            if (!val) return;
            let videoId = val;
            if (val.includes("v=")) videoId = val.split("v=")[1].split("&")[0];
            else if (val.includes("youtu.be/")) videoId = val.split("youtu.be/")[1].split("?")[0];

            if (player && player.loadVideoById) {
                playlist.push({
                    id: videoId,
                    name: "Custom Song",
                    lyrics: [
                        { time: 0, text: "💖 Chúc mừng ngày 20/10 hạnh phúc rạng ngời!" },
                        { time: 10, text: "🎵 Đang phát bản nhạc tuyệt vời theo yêu cầu..." },
                        { time: 30, text: "✨ Chúc bạn luôn mỉm cười và gặp nhiều may mắn!" }
                    ]
                });
                currentSongIndex = playlist.length - 1;
                player.loadVideoById(videoId);
            }
        }
    </script>
</body>
</html>
